[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "flexaligner"
version = "0.2.0a1"
description = "Two-stage forced alignment for long-form real-world speech."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yiming Wang" },
  { name = "Jiahong Yuan" },
]
keywords = ["forced-alignment", "speech", "phonetics", "ctc", "textgrid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "huggingface-hub==0.36.2",
  "numpy>=1.26,<2.3; python_version < '3.14'",
  "numpy>=2.3.5,<3; python_version >= '3.14'",
]

[project.optional-dependencies]
inference = [
  "torch==2.3.1",
  "transformers==4.41.2",
]

[project.scripts]
flexaligner = "flexaligner.cli:main"

[project.urls]
Homepage = "https://github.com/USTCPhonetics/FlexAligner"
Repository = "https://github.com/USTCPhonetics/FlexAligner"
Issues = "https://github.com/USTCPhonetics/FlexAligner/issues"

# These are development-only requirements. They do not enter wheel metadata.
# Exact pins and the first coverage ratchet remain governed by TBD-CI-001.
[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-socket==0.8.0",
]
quality = [
  "mypy==2.3.0",
  "ruff==0.16.2",
  "tomli==2.4.1",
]
package = [
  "build==1.5.0",
  "check-wheel-contents==0.6.3",
  "hatchling==1.32.0",
  "tomli==2.4.1",
  "twine==7.0.0",
]
security = [
  "pip-audit==2.10.1",
]
ci = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "package" },
  { include-group = "security" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/flexaligner"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "/reference/**",
  "/tests/**",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
# The byte-for-byte algorithm snapshot is immutable evidence, not maintained
# source. Its hash guard is the formatter/linter boundary for that directory.
exclude = ["reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
# Runtime and package code is checked strictly. Tests intentionally exercise
# dynamic ModuleType/reflection behavior and are enforced by Ruff + pytest.
files = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
xfail_strict = true
markers = [
  "model_e2e: offline, real-model tests that require frozen external assets",
]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["flexaligner"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# D-015: the initial reviewed Stage-1 branch-coverage baseline is 88%; CI starts
# at a non-decreasing 85% ratchet so minor platform-specific variation cannot
# silently disable the gate.
fail_under = 85
