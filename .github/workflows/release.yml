name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOKENIZERS_PARALLELISM: "false"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  build:
    name: Build immutable distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Require an exact stable tag/version match
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install --group package
      - name: Build once with the pinned backend
        run: python -m build --no-isolation --sdist --wheel
      - name: Check metadata and package inventory
        run: |
          python -m twine check --strict dist/*
          check-wheel-contents dist/*.whl
          python scripts/audit_dist.py
      - name: Upload immutable release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  verify:
    name: Verify the exact wheel
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the exact release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Install and smoke-test outside the source tree
        shell: bash
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pip check
          python -c "import flexaligner; print(flexaligner.__version__)"
          flexaligner --version
          flexaligner capabilities --json > capabilities.json
          python -c "import json; payload=json.load(open('capabilities.json', encoding='utf-8')); assert payload['schema_version'] == 1"

  model-e2e:
    name: Frozen English model E2E
    needs:
      - build
      - verify
    uses: ./.github/workflows/model-e2e.yml
    with:
      distribution_artifact: python-package-distributions

  publish:
    name: Publish through Trusted Publishing
    needs:
      - build
      - verify
      - model-e2e
    if: ${{ needs.model-e2e.result == 'success' && vars.PYPI_RELEASE_AUTHORIZED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/flexaligner
    permissions:
      id-token: write
    steps:
      - name: Download the exact verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
