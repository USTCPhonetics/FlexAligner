name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  source-gate:
    name: Validate tagged alpha source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Require an exact alpha tag and version match
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"

  ci:
    name: Validate exact tagged source
    needs: source-gate
    uses: ./.github/workflows/ci.yml

  model-e2e:
    name: Frozen English and Mandarin model E2E
    needs: ci
    uses: ./.github/workflows/model-e2e.yml
    with:
      distribution_artifact: python-package-distributions

  publish:
    name: Publish through Trusted Publishing
    needs:
      - ci
      - model-e2e
    if: ${{ needs.model-e2e.result == 'success' && vars.PYPI_RELEASE_AUTHORIZED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/flexaligner
    permissions:
      id-token: write
    steps:
      - name: Download the exact verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
