name: Frozen model E2E

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      distribution_artifact:
        description: Same-run artifact name containing the wheel built by the caller
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: model-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  FLEXALIGNER_E2E_ASSET_ROOT: ${{ vars.FLEXALIGNER_E2E_ASSET_ROOT }}
  FLEXALIGNER_E2E_PYTHON: ${{ vars.FLEXALIGNER_E2E_PYTHON }}
  FLEXALIGNER_E2E_WHEELHOUSE: ${{ vars.FLEXALIGNER_E2E_WHEELHOUSE }}
  HF_HUB_OFFLINE: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TOKENIZERS_PARALLELISM: "false"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  model-e2e:
    name: Offline frozen English CPU path
    runs-on:
      - self-hosted
      - linux
      - x64
      - flexaligner-e2e
    timeout-minutes: 60
    steps:
      - name: Retrieve the exact source archive from GitHub codeload
        shell: bash
        env:
          FLEXALIGNER_SOURCE_URL: https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}
        run: |
          umask 077
          download_root="$RUNNER_TEMP/flexaligner-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_root="$RUNNER_TEMP/flexaligner-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          venv_root="$RUNNER_TEMP/flexaligner-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$GITHUB_REPOSITORY" != "USTCPhonetics/FlexAligner" ]; then
            echo "MODEL_E2E_BLOCKED: unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "MODEL_E2E_BLOCKED: github.sha is not a full commit SHA" >&2
            exit 1
          fi
          if [ -e "$download_root" ] || [ -e "$source_root" ] || [ -e "$venv_root" ]; then
            echo "MODEL_E2E_BLOCKED: per-run download or source root already exists" >&2
            exit 1
          fi
          install -d -m 700 "$download_root" "$source_root"
          source_archive="$download_root/source.tar.gz"
          curl \
            --fail \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$source_archive" \
            "$FLEXALIGNER_SOURCE_URL"
          sha256sum "$source_archive"
          expected_prefix="${GITHUB_REPOSITORY#*/}-${GITHUB_SHA}/"
          member_count=0
          while IFS= read -r member; do
            ((member_count += 1))
            case "/$member" in
              */../*|*/./*)
                echo "MODEL_E2E_BLOCKED: unsafe source archive member: $member" >&2
                exit 1
                ;;
            esac
            case "$member" in
              "$expected_prefix"*) ;;
              *)
                echo "MODEL_E2E_BLOCKED: unexpected source archive member: $member" >&2
                exit 1
                ;;
            esac
          done < <(tar -tzf "$source_archive")
          while IFS= read -r listing; do
            case "${listing:0:1}" in
              -|d) ;;
              *)
                echo "MODEL_E2E_BLOCKED: source archive contains a link or special member" >&2
                exit 1
                ;;
            esac
          done < <(tar -tvzf "$source_archive")
          if [ "$member_count" -eq 0 ]; then
            echo "MODEL_E2E_BLOCKED: source archive is empty" >&2
            exit 1
          fi
          tar -xzf "$source_archive" \
            --no-same-owner \
            --no-same-permissions \
            --strip-components=1 \
            --directory "$source_root"
          printf 'FLEXALIGNER_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          printf 'FLEXALIGNER_VENV_ROOT=%s\n' "$venv_root" >> "$GITHUB_ENV"
      - name: Require the pre-provisioned exact Python runtime
        shell: bash
        run: |
          umask 077
          if [ -z "$FLEXALIGNER_E2E_PYTHON" ]; then
            echo "MODEL_E2E_BLOCKED: repository variable FLEXALIGNER_E2E_PYTHON is unset" >&2
            exit 1
          fi
          if [ ! -x "$FLEXALIGNER_E2E_PYTHON" ]; then
            echo "MODEL_E2E_BLOCKED: Python executable is absent: $FLEXALIGNER_E2E_PYTHON" >&2
            exit 1
          fi
          actual_python="$($FLEXALIGNER_E2E_PYTHON -c 'import platform; print(platform.python_version())')"
          if [ "$actual_python" != "3.10.8" ]; then
            echo "MODEL_E2E_BLOCKED: expected Python 3.10.8, got $actual_python" >&2
            exit 1
          fi
          if [ -e "$FLEXALIGNER_VENV_ROOT" ]; then
            echo "MODEL_E2E_BLOCKED: per-run virtual environment already exists" >&2
            exit 1
          fi
          "$FLEXALIGNER_E2E_PYTHON" -m venv "$FLEXALIGNER_VENV_ROOT"
      - name: Require the pre-provisioned offline dependency wheelhouse
        shell: bash
        run: |
          if [ -z "$FLEXALIGNER_E2E_WHEELHOUSE" ]; then
            echo "MODEL_E2E_BLOCKED: repository variable FLEXALIGNER_E2E_WHEELHOUSE is unset" >&2
            exit 1
          fi
          if [ ! -d "$FLEXALIGNER_E2E_WHEELHOUSE" ]; then
            echo "MODEL_E2E_BLOCKED: wheelhouse directory is absent: $FLEXALIGNER_E2E_WHEELHOUSE" >&2
            exit 1
          fi
      - name: Install E2E tooling only from the frozen wheelhouse
        shell: bash
        run: |
          cd "$FLEXALIGNER_SOURCE_ROOT"
          "$FLEXALIGNER_VENV_ROOT/bin/python" -m pip install \
            --no-index \
            --find-links "$FLEXALIGNER_E2E_WHEELHOUSE" \
            pip==26.1.2
          "$FLEXALIGNER_VENV_ROOT/bin/python" -m pip install \
            --no-index \
            --find-links "$FLEXALIGNER_E2E_WHEELHOUSE" \
            --group test \
            --group package
      - name: Download the caller's exact distributions
        if: ${{ inputs.distribution_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.distribution_artifact }}
          path: ${{ runner.temp }}/flexaligner-source-${{ github.run_id }}-${{ github.run_attempt }}/dist
      - name: Build a distribution for scheduled or manual validation
        if: ${{ inputs.distribution_artifact == '' }}
        run: |
          cd "$FLEXALIGNER_SOURCE_ROOT"
          "$FLEXALIGNER_VENV_ROOT/bin/python" -m build --no-isolation --wheel
      - name: Locate exactly one wheel
        shell: bash
        run: |
          cd "$FLEXALIGNER_SOURCE_ROOT"
          "$FLEXALIGNER_VENV_ROOT/bin/python" - <<'PY'
          import os
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"Expected exactly one E2E wheel, got: {wheels}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"FLEXALIGNER_E2E_WHEEL={wheels[0].resolve()}\n")
          PY
      - name: Install the exact wheel with inference dependencies offline
        shell: bash
        run: |
          cd "$FLEXALIGNER_SOURCE_ROOT"
          "$FLEXALIGNER_VENV_ROOT/bin/python" -m pip install \
            --no-index \
            --find-links "$FLEXALIGNER_E2E_WHEELHOUSE" \
            --force-reinstall \
            "${FLEXALIGNER_E2E_WHEEL}[inference]"
          "$FLEXALIGNER_VENV_ROOT/bin/python" -m pip check
      - name: Require and verify all frozen local model assets
        shell: bash
        run: |
          cd "$FLEXALIGNER_SOURCE_ROOT"
          "$FLEXALIGNER_VENV_ROOT/bin/python" scripts/verify_model_assets.py \
            tests/fixtures/e2e/asset_manifest.json \
            --check-runtime \
            --require-approved
      - name: Prove the installed package imports outside the source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$FLEXALIGNER_VENV_ROOT/bin/python" \
            -c "import flexaligner; print(flexaligner.__version__)"
          "$FLEXALIGNER_VENV_ROOT/bin/flexaligner" capabilities --json
      - name: Run the non-skippable frozen-model suite without sockets
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$FLEXALIGNER_VENV_ROOT/bin/python" -m pytest \
            "$FLEXALIGNER_SOURCE_ROOT/tests" \
            -c "$FLEXALIGNER_SOURCE_ROOT/pyproject.toml" \
            -m model_e2e \
            --disable-socket
