name: 🌊 FlexAligner CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # [极客优化] 开启 pip 缓存，让你的 CI 跑得更快

    - name: Install System Audio Decoders
      run: |
        sudo apt-get update
        # [物理装甲 1] 强制注入 ffmpeg 和 libsndfile1。
        # 解决 librosa 在 GitHub 裸机上遇到异常音频时直接死锁的 Bug。
        sudo apt-get install -y libsndfile1 ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "huggingface-hub<1.0"
        pip install .[test]
        # 补充测试 Mock 所需的库
        pip install numpy scipy soundfile pytest-mock

    - name: Run Pytest in CI Vacuum Mode
      env:
        # [虚拟环境信标] 明确告诉你的 Python 代码：现在在 CI 容器里，别找真实路径
        # FLEXALIGNER_IS_CI: "true"
        # # [物理装甲 2] 强行切断 Transformers 的公网探测，把它逼入离线模式
        # HF_HUB_OFFLINE: "1"
        # TRANSFORMERS_OFFLINE: "1"
        CUDA_VISIBLE_DEVICES: ""
      run: |
        echo "🚀 Running pytest in strict CI isolation mode..."
        pytest -v -s tests/ --cache-clear