name: TestPyPI release rehearsal

on:
  workflow_dispatch:
    inputs:
      intent:
        description: Rehearse only, or upload the verified artifacts to TestPyPI
        required: true
        type: choice
        default: rehearsal
        options:
          - rehearsal
          - publish

permissions:
  contents: read

jobs:
  source-gate:
    name: Validate main alpha source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require the selected commit to be the current main head
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "TESTPYPI_BLOCKED: workflow must run from main" >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Require a canonical public alpha version
        run: python scripts/check_release.py --version-only

  ci:
    name: Validate exact candidate source
    needs: source-gate
    uses: ./.github/workflows/ci.yml

  model-e2e:
    name: Frozen English model E2E
    needs: ci
    uses: ./.github/workflows/model-e2e.yml
    with:
      distribution_artifact: python-package-distributions

  publish:
    name: Publish verified artifacts to TestPyPI
    needs:
      - ci
      - model-e2e
    if: >-
      ${{
        inputs.intent == 'publish' &&
        needs.model-e2e.result == 'success' &&
        vars.TESTPYPI_RELEASE_AUTHORIZED == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flexaligner
    permissions:
      id-token: write
    steps:
      - name: Download the exact verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          skip-existing: true
