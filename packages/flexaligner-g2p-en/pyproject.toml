[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "flexaligner-g2p-en"
version = "0.3.0a1"
description = "Pinned offline English G2P language pack for FlexAligner."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Yiming Wang" },
  { name = "Jiahong Yuan" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.26,<2.3; python_version < '3.14'",
  "numpy>=2.3.5,<3; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/USTCPhonetics/FlexAligner"
Repository = "https://github.com/USTCPhonetics/FlexAligner"
Issues = "https://github.com/USTCPhonetics/FlexAligner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flexaligner_g2p_en"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
